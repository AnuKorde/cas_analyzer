name: cas_analyzer
description: Privacy-first, offline CAS portfolio analysis for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.2.1
  go_router: ^18.0.1
  sqflite: ^2.4.4
  path: ^1.9.1
  file_picker: ^13.0.0
  syncfusion_flutter_pdf: ^34.2.8
  fl_chart: ^1.2.0
  shared_preferences: ^2.5.5
  logger: ^2.8.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
